name: Build, Package, and Release Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Extension
        run: |
          mkdir -p dist
          # Compress all extension files into a clean zip, excluding Git & CI files
          zip -r dist/chrome-math-blocker.zip . -x "*.git*" "*.github*" "zip_extension.py" "*.zip"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Generate a tag based on the workflow run number
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" dist/chrome-math-blocker.zip \
            --title "Release $TAG" \
            --notes "Automated release of the Math Lock extension built from commit ${{ github.sha }}." \
            --latest
