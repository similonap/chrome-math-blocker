<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Lock - Focused Mind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="block.css">
</head>
<body>
  <div class="background-glow"></div>
  
  <div class="block-container">
    <div class="glass-card" id="quiz-card">
      <div class="header">
        <div class="logo-area">
          <div class="glowing-shield">
            <svg class="lock-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
        </div>
        <h1 class="logo-title">MATH LOCK</h1>
        <p class="subtitle">Stay focused! You are trying to visit <span id="target-domain" class="domain-badge">...</span></p>
      </div>

      <div class="divider"></div>

      <!-- Quiz Stage -->
      <div class="quiz-body" id="quiz-body">
        <div class="progress-container">
          <div class="progress-text">Challenge Progress: <span id="current-question-num">1</span>/<span id="total-questions-num">5</span></div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill" style="width: 20%;"></div>
          </div>
        </div>

        <div class="equation-box">
          <span id="equation-display">12 + 15</span>
          <span class="equals-sign">=</span>
          <div class="input-wrapper">
            <input type="number" id="answer-input" placeholder="?" autocomplete="off" autofocus>
            <span class="input-focus-line"></span>
          </div>
        </div>

        <div class="feedback-msg" id="feedback-msg">Solve to unlock. Press Enter to submit.</div>
      </div>

      <!-- Success Stage (hidden initially) -->
      <div class="success-body hidden" id="success-body">
        <div class="success-icon-wrapper">
          <svg class="check-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <h2>Focus Unlocked!</h2>
        <p>Redirecting you back to your destination...</p>
      </div>

      <div class="footer-actions">
        <button id="btn-cancel" class="btn btn-secondary">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          Go Back (Return to Safety)
        </button>
      </div>
    </div>
  </div>

  <script src="block.js"></script>
</body>
</html>
